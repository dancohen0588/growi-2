<svg xmlns="http://www.w3.org/2000/svg" viewBox="182 222 660 660" width="660" height="660" role="img" aria-label="Chargement en cours">
  <title>Chargement en cours</title>
  <style>
    .plant,.leaves,.leaf-l,.leaf-r{transform-box:view-box}
    .plant{transform-origin:512px 833px}
    .leaves,.leaf-l,.leaf-r{transform-origin:512px 545px}
    .stem{stroke-dasharray:310;animation:stem 2.8s cubic-bezier(.4,0,.2,1) infinite}
    .leaf-l{animation:leaf-l 2.8s cubic-bezier(.34,1.3,.5,1) infinite}
    .leaf-r{animation:leaf-r 2.8s cubic-bezier(.34,1.3,.5,1) infinite}
    .vein{stroke-dasharray:290;animation:vein 2.8s ease-out infinite}
    @keyframes stem{0%{stroke-dashoffset:310;opacity:1}26%{stroke-dashoffset:0}86%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes leaf-l{0%,20%{transform:scale(0) rotate(28deg);opacity:0}30%{opacity:1}52%{transform:scale(1) rotate(-3deg)}60%,86%{transform:scale(1) rotate(0);opacity:1}96%,100%{transform:scale(1);opacity:0}}
    @keyframes leaf-r{0%,24%{transform:scale(0) rotate(-28deg);opacity:0}34%{opacity:1}56%{transform:scale(1) rotate(3deg)}64%,86%{transform:scale(1) rotate(0);opacity:1}96%,100%{transform:scale(1);opacity:0}}
    @keyframes vein{0%,52%{stroke-dashoffset:290;opacity:1}70%,86%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g class="plant">
    <path class="stem" d="M 512 833 L 512 530" fill="none" stroke="#B4DD7F" stroke-width="46" stroke-linecap="round"/>
    <g class="leaves">
      <g class="leaf-l">
        <path d="M 512 528 C 498 420, 400 296, 207 278 C 197 400, 234 505, 318 550 C 388 586, 464 578, 512 562 Z" fill="#B4DD7F"/>
        <path class="vein" d="M 488 527 L 275 338" fill="none" stroke="#2d7a47" stroke-width="16" stroke-linecap="round"/>
      </g>
      <g class="leaf-r">
        <path d="M 512 528 C 526 420, 624 296, 817 278 C 827 400, 790 505, 706 550 C 636 586, 560 578, 512 562 Z" fill="#B4DD7F"/>
        <path class="vein" d="M 536 527 L 749 338" fill="none" stroke="#2d7a47" stroke-width="16" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
